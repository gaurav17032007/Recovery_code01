<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<h1 id="count">Counter</h1>
<button class="start">start</button>
<button class="end">end</button>
<script>
    let element = document.getElementsByClassName("start")[0];
    let element1 = document.getElementsByClassName("end")[0];
    let interval;
    element.addEventListener("click", () => {
        clearInterval(interval);
        let count1 = 0;
        interval = setInterval(() => {
            count1++;
            document.getElementById("count").textContent = count1;
        }, 1000);
    });
    element1.addEventListener("click", () => {
        let display1 = document.getElementById("count");
        let count = 0;
        setTimeout(() => {
            clearInterval(interval);
        }, 1000);
    })
</script>
</body>

</html>
