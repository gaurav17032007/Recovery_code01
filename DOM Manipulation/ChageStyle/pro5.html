<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .xyz{
            background-color: black;
            color: white;
        }
        .abc{
            background-color: red;
            color: black;
        }
    </style>
</head>
<body>
    <div id ="demo" class="xyz">
        <h1>Hello World</h1>
    </div>

    <script>
        let doc=document.getElementById("demo");
        doc.addEventListener("click",()=>{
            doc.classList.remove("abc");
            console.log(doc.classList);
        })
    </script>
</body>
</html>
