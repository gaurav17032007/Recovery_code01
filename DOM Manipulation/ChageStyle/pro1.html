<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="id01">red</button>
    <button id="id02">blue</button>
    <button id="id03">pink</button>
    <button id="id04">green</button>
    <button id="id05">black</button>
    <script>
        // naya div (box) create kiya
        let box = document.createElement("div");
        box.style.width = "200px";
        box.style.height = "200px";
        box.style.border = "2px solid black";
        box.style.marginTop="10px";

        document.body.appendChild(box);
        let doc=document.getElementById("id01");
        let doc1=document.getElementById("id02");
        let doc2=document.getElementById("id03");
        let doc3=document.getElementById("id04");
        let doc4=document.getElementById("id05");
        doc.addEventListener("click",()=>{
            box.style.background="red";
        })
        doc1.addEventListener("click",()=>{
            box.style.backgroundColor="blue";
        })
        doc2.addEventListener("click",()=>{
            box.style.backgroundColor="pink";
        })
        doc3.addEventListener("click",()=>{
            box.style.backgroundColor="green";
        })
        doc4.addEventListener("click",()=>{
            box.style.backgroundColor="black";
        })
    </script>
</body>

</html>
