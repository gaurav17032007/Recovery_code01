<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .abc {
            background-color: black;
            color: white;
            height: 100vh;
        }

        .xyz {
            background-color: rgba(238, 210, 210, 0.685);
            color: black;
        }
    </style>
</head>

<body>
    <div id="demo" class="abc">
        <button id="Light">Light</button>
        <button id="Dark">Dark</button>
        <div>
            <h1>Hello1</h1>
            <h1>Hello2</h1>
            <h1>Hello3</h1>
            <h1>Hello4</h1>
            <h1>Hello5</h1>
        </div>
    </div>
    <script>
        let doc1 = document.getElementById("Light");
        doc1.addEventListener("click", () => {
            document.getElementById("demo").classList.add("xyz");
        })

        let doc2 = document.getElementById("Dark");
        doc2.addEventListener("click", () => {
            document.getElementById("demo").classList.remove("xyz");
            // document.getElementById("demo").classList.add("abc");
        })
    </script>
</body>

</html>
