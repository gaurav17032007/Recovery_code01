<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div id="demo">

    </div>
    <button id="remove">remove</button>
    <script>
        let doc=document.getElementById("demo");
        let h1=document.createElement("h1");
        h1.textContent="Hello User";
        doc.append(h1);

        let doc1=document.getElementById("remove");
        doc1.addEventListener("click",()=>{
                h1.remove();
        })
    </script>
</body>

</html>
