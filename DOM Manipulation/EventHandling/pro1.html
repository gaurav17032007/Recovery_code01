<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let doc=document.createElement("div");
        document.body.append(doc);

        let text=document.createElement("h1");
        text.textContent="Hello";
        doc.append(text);

        let doc1=document.createElement("input");
        doc1.type="text";
        doc.append(doc1);

        let doc2=document.createElement("button");
        doc2.textContent="submit";
        doc.append(doc2);

        doc1.classList.add("abc");        
        doc2.classList.add("xyz");
    
        let doc5=document.querySelector(".abc");
        let doc6=document.querySelector(".xyz");

        let int;
        doc5.addEventListener("input",()=>{
            int=text.textContent=doc5.value;              
            console.log(int);
           })

        doc6.addEventListener("click",()=>{            
            alert(int);
           })   
    </script>
</body>
</html>
