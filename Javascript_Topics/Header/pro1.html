<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .Nav_div {
            width: 100%;
            max-width: 1400px;
            margin: 20px auto;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px 20px;
            box-sizing: border-box;
        }
        .logo{
            /* display: flex; */
            /* gap: 20px; */
            /* flex: 1; */
        }
        .Nav_link {
            flex: 1;
            /* margin: 20px auto; */
            padding: 10px;
            border: 2px solid red;
            display: flex;
            gap: 20px;
            justify-content: space-between;
            align-items: center;
        }
        
        .Home_plus {
            /* flex: 1; */
            flex: 1;
            display: flex;
            gap: 20px;
        }
        .Nav_input{

        }
        .Wishlist_plus {

        }

            <div class="Wishlist_plus">
