<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <style>
        #demo{
            border: 2px solid black;
            width: 100px;
            height: 30vh;
            background-color: red;
        }
    </style>
</head>
<body>
    <div id="demo">

    </div>
    <!-- <button id="btn">click</button> -->
    <script>
        let doc=document.getElementById("demo");
        doc.addEventListener("mouseover",()=>{
            doc.style.borderRadius="20px";
        })

        doc.addEventListener("mouseout",()=>{
            doc.style.borderRadius="0px";
        })
    </script>
</body>
</html>
